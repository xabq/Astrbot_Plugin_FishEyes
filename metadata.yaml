name: AstrbotFishEyes
display_name: AstrbotFishEyes (电脑屏幕与远程控制)
short_desc: 查看与操控本地或远程电脑屏幕，支持实时画面、点击输入、二级WebUI控制台与LLM自动化工具
desc: |
  # AstrbotFishEyes - 电脑屏幕与远程控制 (Screen Control & Computer Use)

  让 AstrBot 可以查看和操控**本地电脑**或**远程电脑**屏幕！
  本插件提供全套屏幕自动化能力，包含：

  ## 🌟 核心特性
  - 🖥️ **本地/远程双模式**：
    - **本地模式 (Local)**：AstrBot 运行在桌面系统时，免配置直接控制本机屏幕与键鼠；
    - **远程模式 (Remote)**：AstrBot 运行在云服务器/Docker 时，通过轻量级被控端 Agent 或正/反向 SSH 隧道安全连接目标电脑。
  - 🌐 **二级 WebUI 可视化控制台 (Plugin View)**：
    - 集成在 AstrBot 管理面板内部，免开端口，自动鉴权；
    - **交互式画布**：实时查看桌面画面，**在画面上直接点击/双击/右键，即可精准控制电脑鼠标**！
    - **虚拟控制面板**：文本快速输入（支持中文）、常用按键与组合键（Win+D、Alt+Tab、Ctrl+C/V、TaskMgr等）、鼠标滚轮滚动；
    - **设备与状态监控**：查看分辨率、平台类型、连接延迟，一键切换模式与重连。
  - 🤖 **LLM Agent 工具集 (Computer Use)**：
    - 内置 11 个针对大模型的标准工具函数（截图并发送图片、点击、输入、按键、组合键、滚动、拖拽等）；
    - 支持大模型自主决策观察屏幕并完成自动化任务。
  - 💬 **聊天指令支持**：
    - 支持 `/screen`、`/cu`、`/屏幕` 等指令直接在聊天中执行截图与操作。
  - 🔒 **严格安全控制**：
    - 管理员默认放行，支持配置用户白名单与权限提示；
    - WebUI 控制面板支持紧急锁定开关，防止误操作。

  ## 快速使用
  - 在 AstrBot WebUI 插件详情中打开 **屏幕控制台 (View)**
  - 聊天中使用 `/screen 截图`、`/screen 点击 x y`、`/screen 帮助`
  - 对话中直接让 AI 观察并操作电脑屏幕

