apply plugin: 'com.android.application'

android {
    namespace 'com.example.sshadbtunnel'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.sshadbtunnel"
        minSdk 29
        targetSdk 34
        versionCode 11
        versionName "1.1.12"
    }

    // 说明：本工程没有任何 native 库(jniLibs/NDK)，原先的 splits.abi 只会产生无意义的
    // 多 ABI 变体，故已移除。需要按 ABI 分包时再打开。

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            // 如需发布，请自行配置 signingConfigs
        }
    }
}

dependencies {
    // 零外部依赖：全部基于 android.jar + JDK 标准库
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
